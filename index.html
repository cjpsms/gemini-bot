<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Gemma</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; }
  .user { background: #2a2a2a; align-self: flex-end; }
  .gemma { background: #1a3a2a; align-self: flex-start; }
  #bar { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #222; }
  #input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 10px 14px; border-radius: 8px; font-size: 15px; outline: none; }
  #send { background: #2a6a4a; color: #eee; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="log"></div>
<div id="bar">
  <input id="input" placeholder="พิมข้อความ..." autofocus>
  <button id="send">ส่ง</button>
</div>
<script>
  const log   = document.getElementById("log");
  const input = document.getElementById("input");
  const send  = document.getElementById("send");

  function addMsg(text, who) {
    const div = document.createElement("div");
    div.className = `msg ${who}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMsg(text, "user");
    try {
      const res = await fetch("http://localhost:2458/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, mode: "search" })
      });
      const data = await res.json();
      addMsg(data.reply, "gemma");
    } catch {
      addMsg("error: ติดต่อ server ไม่ได้", "gemma");
    }
  }

  send.addEventListener("click", sendMsg);
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });
</script>
</body>
</html>
